name: Build macOS installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Geovoya release version to build (published source tarball)'
        required: true
        default: '0.2.1'

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      GEOVOYA_VERSION: ${{ inputs.version }}
      GEOVOYA_TARGET_PLATFORM: darwin
      GEOVOYA_TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Download published source tarball and checksums
        run: |
          set -euo pipefail
          base="https://downloads.geovoya.com/releases/${GEOVOYA_VERSION}"
          tarball="geovoya-${GEOVOYA_VERSION}-source.tar.gz"
          echo "Fetching ${base}/${tarball}"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 \
            --output "${tarball}" "${base}/${tarball}"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
            --output SHA256SUMS.txt "${base}/SHA256SUMS.txt"
          ls -l "${tarball}" SHA256SUMS.txt

      - name: Verify SHA-256 of the source tarball
        run: |
          set -euo pipefail
          tarball="geovoya-${GEOVOYA_VERSION}-source.tar.gz"
          # SHA256SUMS.txt lists "<file>  <hash>"; accept either column order.
          expected="$(awk -v f="${tarball}" '
            {
              seen = 0; hash = ""
              for (i = 1; i <= NF; i++) {
                field = $i
                sub(/^\*/, "", field)
                if (field == f) seen = 1
                else if (field ~ /^[0-9a-fA-F]{64}$/) hash = tolower(field)
              }
              if (seen && hash != "") { print hash; exit }
            }' SHA256SUMS.txt)"
          if [ -z "${expected}" ]; then
            echo "::error::No SHA-256 entry for ${tarball} in the published SHA256SUMS.txt"
            cat SHA256SUMS.txt
            exit 1
          fi
          actual="$(shasum -a 256 "${tarball}" | awk '{print $1}' | tr 'A-F' 'a-f')"
          echo "expected ${expected}"
          echo "actual   ${actual}"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::SHA-256 mismatch for ${tarball} - refusing to extract or build"
            exit 1
          fi
          echo "Source tarball checksum verified."

      - name: Extract verified source
        run: |
          set -euo pipefail
          tarball="geovoya-${GEOVOYA_VERSION}-source.tar.gz"
          mkdir -p source
          tar -xzf "${tarball}" -C source --strip-components=1
          test -f source/package.json
          test -f source/package-lock.json
          node -e "const p=require('./source/package.json'); if(p.version!==process.env.GEOVOYA_VERSION) throw new Error('Tarball version '+p.version+' does not match requested '+process.env.GEOVOYA_VERSION)"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Last 3.12 release with macOS artifacts in actions/python-versions.
          python-version: '3.12.10'
          architecture: ${{ matrix.arch }}

      - name: Verify native runtime architecture
        run: node -e "if(process.platform!==process.env.GEOVOYA_TARGET_PLATFORM || process.arch!==process.env.GEOVOYA_TARGET_ARCH) throw new Error('Build host architecture does not match target')"

      - name: Install locked npm dependencies
        working-directory: source
        run: npm ci

      - name: Prepare bundled phone runtimes
        working-directory: source
        run: npm run runtime:prepare
        env:
          GEOVOYA_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Test adapters and sidecar
        working-directory: source
        run: npm test

      # Without a Developer ID certificate, ad-hoc sign the whole bundle. An unsigned bundle whose
      # Electron signature was broken by packaging is reported by Gatekeeper as "damaged".
      # Hardened runtime stays off: with no Team ID it would reject the bundled ad-hoc libraries.
      - name: Build ad-hoc signed installers without publishing
        working-directory: source
        run: npm run dist -- --publish never --${{ matrix.arch }} -c.mac.identity=- -c.mac.hardenedRuntime=false

      - name: Verify the app's code signature
        working-directory: source
        run: |
          set -euo pipefail
          app="$(find release -maxdepth 2 -name Geovoya.app -type d | head -n 1)"
          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign -dv "${app}" 2>&1 | grep -E 'Signature=|Identifier=|flags='
          dmg="$(ls release/*.dmg | head -n 1)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "${mnt}" "${dmg}"
          codesign --verify --deep --strict --verbose=2 "${mnt}/Geovoya.app"
          hdiutil detach "${mnt}"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Geovoya-${{ inputs.version }}-mac-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            source/release/*.dmg
            source/release/*.zip

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-mac-${{ matrix.arch }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            source/resources/adb/**/provenance.json
            source/resources/android/provenance.json
            source/resources/ios/**/build-info.json
            source/resources/ios/**/build-dependencies.txt
            source/sidecar/build/**/warn-geovoya-ios.txt
            source/release/builder-effective-config.yaml
